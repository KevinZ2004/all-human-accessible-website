<!DOCTYPE html>
<html lang="nl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Veldverkenner</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
</head>

<body>

    <header>
        <a href="index.html" class="logo">
            Veldverkenner
        </a>
    </header>

    <main>

        <section class="kaart-sectie">
            <div class="kaart-header">
                <!-- <h1>Vind ons in Park Frankendael</h1>
                <p>Bekijk de locatie op de kaart en ontdek waar je ons kunt vinden.</p> -->
            </div>

            <div class="kaart-container">
                <div id="kaart" role="region"
                    aria-label="Kaart van Park Frankendael met drie plantenlocaties"></div>

                <!-- Paneel met de collectie van de aangeklikte locatie -->
                <aside id="collectie-paneel" class="collectie-paneel" role="dialog"
                    aria-modal="false" aria-labelledby="paneel-titel" hidden>
                    <button type="button" class="paneel-sluit" aria-label="Sluit collectie">&times;</button>
                    <h2 id="paneel-titel" tabindex="-1"></h2>
                    <p id="paneel-intro" class="paneel-intro"></p>
                    <ul id="paneel-lijst" class="paneel-lijst"></ul>
                </aside>
            </div>
        </section>

    </main>

    <footer class="main-footer">
        <ul>
            <li>
                <a href="index.html">
                    <img src="images/Home.svg" alt="" class="icon">
                    <span>Home</span>
                </a>
            </li>

            <li>
                <a href="veldverkenner.html" class="active" aria-current="page">
                    <img src="images/Veldverkenner.svg" alt="" class="icon">
                    <span>Veldverkenner</span>
                </a>
            </li>

            <li>
                <a href="collectie.html">
                    <img src="images/Collectie.svg" alt="" class="icon">
                    <span>Collectie</span>
                </a>
            </li>
        </ul>
    </footer>

    <!-- Leaflet eerst, daarna eigen script -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="veldverkenner.js"></script>
</body>

</html>
